<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TinyWiki — Transform any topic, YouTube video, or document into a beautiful, structured, AI-powered wiki in seconds." />
    <title>TinyWiki - Organic Learning</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['"DM Serif Display"', 'serif'],
              sans: ['Inter', 'sans-serif'],
              hand: ['"Nanum Pen Script"', 'cursive'],
            },
            colors: {
              'beige-bg': '#FDFCF8',
              'earth-brown': '#272320',
              'terracotta': '#C56E47',
              'soft-sage': '#94A795',
              'soft-yellow': '#EFE6D5',
              'charcoal': '#374151',
            },
            boxShadow: {
              'soft': '0 4px 30px -5px rgba(39, 35, 32, 0.04)',
              'soft-hover': '0 10px 40px -5px rgba(39, 35, 32, 0.08)',
            },
            typography: (theme) => ({
              DEFAULT: {
                css: {
                  color: theme('colors.earth-brown'),
                  a: {
                    color: theme('colors.terracotta'),
                    '&:hover': {
                      color: theme('colors.earth-brown'),
                    },
                  },
                },
              },
            }),
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      body {
        background-color: #FDFCF8;
        color: #272320;
        -webkit-font-smoothing: antialiased;
      }

      /* Dark mode overrides */
      html.dark body { background-color: #1a1410 !important; color: #e8ddd5 !important; }
      html.dark .bg-beige-bg { background-color: #1a1410 !important; }
      html.dark .bg-white { background-color: #2a2018 !important; color: #e8ddd5; }
      html.dark .bg-\[\#FAFAFA\], html.dark .bg-\[\#FCFCFC\] { background-color: #221a12 !important; }
      html.dark .border-gray-100, html.dark .border-gray-200 { border-color: #3a2e24 !important; }
      html.dark .text-earth-brown { color: #e8ddd5 !important; }
      html.dark .bg-gray-50, html.dark .bg-gray-100 { background-color: #2e2218 !important; }
      html.dark .text-gray-400, html.dark .text-gray-500 { color: #9a8880 !important; }
      html.dark .text-gray-300 { color: #6a5e58 !important; }

      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      ::selection {
        background-color: #EFE6D5;
        color: #272320;
      }

      @media print {
        @page { margin: 1.5cm; size: auto; }
        html, body {
          height: auto;
          overflow: visible;
          background-color: white !important;
          color: black !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        #root {
          height: auto;
          overflow: visible;
        }
        .print-hidden, [class~="print:hidden"] { display: none !important; }
        aside { display: none !important; }
        #root main { width: 100% !important; max-width: none !important; margin: 0 !important; box-shadow: none !important; ring: none !important; }
        #root main > header { break-inside: avoid; }
        article, section { break-inside: auto; }
        h1, h2, h3, h4 { break-after: avoid; }
        p, li, blockquote, pre { orphans: 3; widows: 3; }
        a { color: inherit; text-decoration: none; }
        .no-break { break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
