<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TinyWiki — Transform any topic, YouTube video, or document into a beautiful, structured, AI-powered wiki in seconds." />
    <script>
      try {
        if (localStorage.getItem('tinywiki_dark_mode') === 'true') {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>
    <title>TinyWiki - Organic Learning</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['"DM Serif Display"', 'serif'],
              sans: ['Inter', 'sans-serif'],
              hand: ['"Nanum Pen Script"', 'cursive'],
            },
            colors: {
              'beige-bg': '#FDFCF8',
              'earth-brown': '#272320',
              'terracotta': '#C56E47',
              'soft-sage': '#94A795',
              'soft-yellow': '#EFE6D5',
              'charcoal': '#374151',
            },
            boxShadow: {
              'soft': '0 4px 30px -5px rgba(39, 35, 32, 0.04)',
              'soft-hover': '0 10px 40px -5px rgba(39, 35, 32, 0.08)',
            },
            typography: (theme) => ({
              DEFAULT: {
                css: {
                  color: theme('colors.earth-brown'),
                  a: {
                    color: theme('colors.terracotta'),
                    '&:hover': {
                      color: theme('colors.earth-brown'),
                    },
                  },
                },
              },
            }),
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      body {
        background-color: #FDFCF8;
        color: #272320;
        -webkit-font-smoothing: antialiased;
      }

      /* Dark mode overrides */
      html.dark { color-scheme: dark; }
      html.dark body { background-color: #1a1410 !important; color: #e8ddd5 !important; }
      html.dark .bg-beige-bg { background-color: #1a1410 !important; }
      html.dark [class~="bg-beige-bg/90"], html.dark [class~="bg-beige-bg/95"] { background-color: rgba(26, 20, 16, 0.96) !important; }
      html.dark header[class~="bg-beige-bg/90"] { background-color: rgba(26, 20, 16, 0.96) !important; }
      html.dark #mobile-navigation { background-color: #1a1410 !important; }
      html.dark .bg-white { background-color: #2a2018 !important; color: #e8ddd5 !important; }
      html.dark .bg-\[\#FAFAFA\], html.dark .bg-\[\#FCFCFC\] { background-color: #221a12 !important; }
      html.dark [class~="bg-[#FAFAFA]"], html.dark [class~="bg-[#FCFCFC]"] { background-color: #221a12 !important; }
      html.dark .bg-gray-50, html.dark .bg-gray-100 { background-color: #30251e !important; }
      html.dark .bg-earth-brown { background-color: #59473d !important; }
      html.dark .text-earth-brown { color: #e8ddd5 !important; }
      html.dark [class~="text-earth-brown/90"], html.dark [class~="text-earth-brown/80"],
      html.dark [class~="text-earth-brown/75"], html.dark [class~="text-earth-brown/70"],
      html.dark [class~="text-earth-brown/60"], html.dark [class~="text-earth-brown/50"],
      html.dark [class~="text-earth-brown/40"], html.dark [class~="text-earth-brown/30"],
      html.dark [class~="text-earth-brown/20"] { color: #c7b9ae !important; }
      html.dark .text-gray-600, html.dark .text-gray-700, html.dark .text-gray-800 { color: #d8cbc1 !important; }
      html.dark .text-gray-400, html.dark .text-gray-500 { color: #b7a79b !important; }
      html.dark .text-gray-300 { color: #aa998d !important; }
      html.dark .text-gray-200 { color: #84756b !important; }
      html.dark .border-gray-50, html.dark .border-gray-100, html.dark .border-gray-200,
      html.dark .border-gray-300 { border-color: #493a31 !important; }
      html.dark [class~="border-[#E5E0D8]"] { border-color: #59483e !important; }
      html.dark [class~="border-earth-brown/5"], html.dark [class~="border-earth-brown/10"] { border-color: #493a31 !important; }
      html.dark input:not([type="file"]), html.dark textarea, html.dark select {
        background-color: #2a2018 !important;
        color: #e8ddd5 !important;
        border-color: #59483e !important;
      }
      html.dark input.text-earth-brown { color: #e8ddd5 !important; }
      html.dark input::placeholder, html.dark textarea::placeholder { color: #ad9b8f !important; }

      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      ::selection {
        background-color: #EFE6D5;
        color: #272320;
      }

      @media print {
        @page { margin: 1.5cm; size: auto; }
        html, body {
          height: auto;
          overflow: visible;
          background-color: white !important;
          color: black !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        #root {
          height: auto;
          overflow: visible;
        }
        .print-hidden, [class~="print:hidden"] { display: none !important; }
        aside { display: none !important; }
        #root > div > header { display: none !important; }
        #root main { width: 100% !important; max-width: none !important; margin: 0 !important; box-shadow: none !important; ring: none !important; }
        #root main > header { break-inside: avoid; }
        article, section { break-inside: auto; }
        h1, h2, h3, h4 { break-after: avoid; }
        p, li, blockquote, pre { orphans: 3; widows: 3; }
        a { color: inherit; text-decoration: none; }
        .no-break { break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
